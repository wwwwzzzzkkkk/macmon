name: ChipBar CI
on:
  push:
    branches: [chipbar]
    paths: ["apps/ChipBar/**", "Casks/**", ".github/workflows/chipbar-*.yml"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    working-directory: apps/ChipBar
jobs:
  verify:
    # Apple Silicon GitHub-hosted runner; avoids stalled macOS 15 job allocation.
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Version management tests
        run: python3 -m unittest discover -s Tests/ReleaseTests -v
      - name: Parser tests
        run: ./scripts/test.sh
      - name: Build arm64 app
        run: ./scripts/build.sh
      - name: Subprocess fault checks
        run: python3 scripts/integration.py
      - name: Package and verify signature
        run: python3 scripts/version.py package
      - uses: actions/upload-artifact@v6
        with:
          name: ChipBar-arm64-${{ github.sha }}
          path: |
            apps/ChipBar/dist/ChipBar-macOS-arm64.zip
            apps/ChipBar/dist/SHA256SUMS
          retention-days: 14
