name: ChipBar CI
on:
  push:
    branches: [chipbar]
    paths: ["apps/ChipBar/**", "Casks/**", ".github/workflows/chipbar-*.yml"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    working-directory: apps/ChipBar
jobs:
  verify:
    # Apple Silicon stable fallback: GitHub currently provides Xcode 26.3 on macOS 15.
    # macos-26 jobs were cancelled before any step began; use a different runner image
    # to distinguish image allocation problems from code/build failures.
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - name: Select Xcode 26 and print runner diagnostics
        working-directory: .
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          sw_vers
          uname -m
          xcodebuild -version
          swift --version
      - name: Version management tests
        run: python3 -m unittest discover -s Tests/ReleaseTests -v
      - name: Parser tests
        run: ./scripts/test.sh
      - name: Build arm64 app
        run: ./scripts/build.sh
      - name: Subprocess fault checks
        run: python3 scripts/integration.py
      - name: Package and verify signature
        run: python3 scripts/version.py package
      - uses: actions/upload-artifact@v6
        with:
          name: ChipBar-arm64-${{ github.sha }}
          path: |
            apps/ChipBar/dist/ChipBar-macOS-arm64.zip
            apps/ChipBar/dist/SHA256SUMS
          retention-days: 14
