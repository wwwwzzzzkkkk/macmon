name: ChipBar Release
on:
  push:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish or repair (e.g. chipbar-v1.1.4)
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: chipbar-stable-release
  cancel-in-progress: false
defaults:
  run:
    working-directory: apps/ChipBar
jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/chipbar-v') ||
      (github.ref == 'refs/heads/chipbar' &&
       (contains(github.event.head_commit.modified, 'apps/ChipBar/VERSION') ||
        contains(github.event.head_commit.modified, '.github/workflows/chipbar-release.yml')))
    runs-on: macos-15
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate manual tag input
        working-directory: .
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ inputs.tag }}
        run: |
          python3 -c 'import os,re; assert re.fullmatch(r"chipbar-v[0-9]+\.[0-9]+\.[0-9]+",os.environ["TAG"]), "Expected chipbar-vX.Y.Z tag"'
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Create or verify version tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG="$INPUT_TAG"
          elif [[ "$REF_TYPE" == "tag" ]]; then
            TAG="$REF_NAME"
          else
            TAG="chipbar-v$(cat VERSION)"
          fi
          if [[ "$EVENT_NAME" == "push" && "$REF_TYPE" == "branch" ]]; then
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
              git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
              TAGGED_COMMIT="$(git rev-parse "$TAG^{commit}")"
              if [[ "$TAGGED_COMMIT" != "$GITHUB_SHA" ]]; then
                echo "Refusing to move existing tag $TAG from $TAGGED_COMMIT." >&2
                exit 1
              fi
            else
              gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
                -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" >/dev/null
              git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
            fi
          fi
          echo "CHIPBAR_RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
      - name: Check immutable version tag
        run: python3 scripts/version.py check-tag
      - name: Version management tests
        run: python3 -m unittest discover -s Tests/ReleaseTests -v
      - name: Parser tests
        run: ./scripts/test.sh
      - name: Build arm64 app
        run: ./scripts/build.sh
      - name: Subprocess fault checks
        run: python3 scripts/integration.py
      - name: Package and verify signature
        run: python3 scripts/version.py package
      - name: Publish Release and update Homebrew
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 scripts/version.py publish
