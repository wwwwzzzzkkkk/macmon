# One-off recovery path for ChipBar v2.1.7, using the already verified
# macOS-26 arm64 CI archive while macOS Release runners are backlogged.
# The normal release workflow remains the default for future versions.
name: ChipBar 2.1.7 Publish Verified Archive
on:
  push:
    branches: [chipbar]
    paths:
      - .github/workflows/chipbar-publish-verified-2-1-7.yml
permissions:
  actions: read
  contents: write
concurrency:
  group: chipbar-verified-archive-v2-1-7
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      CHIPBAR_RELEASE_TAG: chipbar-v2.1.7
    defaults:
      run:
        working-directory: apps/ChipBar
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Assert pinned successful macOS build
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = "2.1.7"
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/40750638258 --jq .conclusion)" = "success"
          git fetch origin 62633682aef3d352e6e400d124654375e92428e8
          git diff --exit-code FETCH_HEAD HEAD -- apps/ChipBar
      - uses: actions/download-artifact@v6
        with:
          name: ChipBar-arm64-300a60db46f2a52ce6e0162186d06baf7e2993ea
          run-id: 40750638258
          github-token: ${{ github.token }}
          path: apps/ChipBar/dist
      - name: Validate immutable macOS archive and internal bundle metadata
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check SHA256SUMS
          python3 - <<'PY'
          import plistlib, struct, zipfile
          from pathlib import Path
          with zipfile.ZipFile("ChipBar-macOS-arm64.zip") as bundle:
              assert bundle.testzip() is None, "Archive integrity failure"
              info = plistlib.loads(bundle.read("ChipBar.app/Contents/Info.plist"))
              assert info["CFBundleShortVersionString"] == "2.1.7"
              assert info["CFBundleVersion"] == "2.1.7"
              assert info["CFBundleIdentifier"] == "local.chipbar.monitor"
              executable = bundle.read("ChipBar.app/Contents/MacOS/ChipBar")
              assert executable[:4] == bytes.fromhex("cffaedfe"), "Not a thin Mach-O executable"
              assert struct.unpack("<I", executable[4:8])[0] == 0x0100000c, "Not arm64"
          print("Reused macOS-26 CI artifact: verified SHA-256, ZIP and arm64 application metadata")
          PY
      - name: Create immutable version tag (or validate it)
        run: |
          set -euo pipefail
          tag="chipbar-v2.1.7"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "Existing tag must already match the current release commit."
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA" >/dev/null
          fi
          git fetch origin "refs/tags/$tag:refs/tags/$tag"
          python3 scripts/version.py check-tag
      - name: Publish verified archive and update Homebrew
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 scripts/version.py publish
